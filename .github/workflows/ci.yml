name: ci
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Lint
        run: mise run lint

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=image-docker.tar
          tags: pi-less-yolo:latest
          # Distinct scope per image: the GHA backend defaults every build to the
          # same "buildkit" scope, so without this the omp export below would
          # overwrite this cache and force a full rebuild on the next run.
          cache-from: type=gha,scope=pi
          cache-to: type=gha,mode=max,scope=pi
          secret-files: |
            mise_asc=./mise-release.asc

      - name: Build omp Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.omp
          push: false
          outputs: type=docker,dest=image-omp-docker.tar
          tags: omp-less-yolo:latest
          cache-from: type=gha,scope=omp
          cache-to: type=gha,mode=max,scope=omp

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pi-image-docker
          path: |
            image-docker.tar
            image-omp-docker.tar
          retention-days: 1

  build-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Podman has no gha cache-from/cache-to integration, so cache its storage dir directly.
      - name: Cache Podman storage
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/containers/storage
          key: podman-storage-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Dockerfile.omp') }}
          restore-keys: |
            podman-storage-${{ runner.os }}-

      - name: Build Podman image
        run: podman build --secret id=mise_asc,src=./mise-release.asc -t pi-less-yolo:latest .

      - name: Build omp Podman image
        run: podman build -f ./Dockerfile.omp -t omp-less-yolo:latest .

      - name: Save image
        run: podman save -o image-podman.tar pi-less-yolo:latest

      - name: Save omp image
        run: podman save -o image-omp-podman.tar omp-less-yolo:latest

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pi-image-podman
          path: |
            image-podman.tar
            image-omp-podman.tar
          retention-days: 1

  test-docker:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pi-image-docker

      - name: Load image
        run: docker load -i image-docker.tar

      - name: Load omp image
        run: docker load -i image-omp-docker.tar

      - name: Test
        run: mise run test

  test-podman:
    runs-on: ubuntu-latest
    needs: build-podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pi-image-podman

      - name: Load image
        run: podman load -i image-podman.tar

      - name: Load omp image
        run: podman load -i image-omp-podman.tar

      - name: Test
        run: PI_CONTAINER_RUNTIME=podman mise run test
